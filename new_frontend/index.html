<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23131313'/%3E%3Cpath d='M8 22V10l8 7 8-7v12' stroke='%23E1E5C9' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="UniPulse AI — precision product intelligence for industrial catalogs. Enrich SKUs, process batch catalogs, and export structured, normalized data."
    />
    <title>UniPulse AI — Industrial Intelligence Engine</title>
    <!-- Editorial type system: EB Garamond (display) + Inter (data/UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols Outlined (thin-stroke technical icons) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <!-- Apply the persisted theme before first paint (no flash of wrong theme).
         Defaults to dark (obsidian) when nothing is stored. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('unipulse-theme');
          var dark = saved !== 'light'; // default: dark
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
